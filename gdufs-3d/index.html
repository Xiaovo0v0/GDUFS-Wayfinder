<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#004694" />
<link rel="icon" href="data:," />
<title>尚行 · 广外校园向导</title>
<style>
  /* ============================================================
     设计变量：取自广外校徽与官网页
     校徽"主体以中蓝色为基调，图案为白色，校名为红色"
     官网 CSS 实测主色 #004694（出现 61 次）、红 #E60013
     ============================================================ */
  :root {
    --gw-blue-900: #063d7c;
    --gw-blue-700: #004694;
    --gw-blue-500: #27509a;
    --gw-blue-100: #e8f0fa;
    --gw-cyan: #56b6e7;
    --gw-red: #e60013;
    --gw-red-soft: #fdecee;

    --ink-900: #1a2430;
    --ink-700: #33414f;
    --ink-500: #5d6b7b;
    --ink-300: #93a1b1;

    --surface: #ffffff;
    --surface-2: #f4f7fb;
    --line: #dce4ee;

    --r-s: 8px;
    --r-m: 12px;
    --r-l: 16px;
    --sh-1: 0 2px 8px rgba(10, 40, 80, .08);
    --sh-2: 0 10px 30px rgba(10, 40, 80, .14);

    --font: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

    /* 手机安全区：刘海 / 底部小白条。桌面浏览器取到 0px，不影响原布局 */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --kb: 0px;              /* 软键盘高度，由 mobile.js 写入 */
  }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: var(--font);
    color: var(--ink-900);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; }
  button { font-family: inherit; }

  /* ---------- 顶部品牌条 ---------- */
  #topbar {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 12px 0 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-m); box-shadow: var(--sh-1);
  }
  #logo {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--gw-blue-700); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; letter-spacing: 0;
    flex: 0 0 auto;
  }
  #brand { display: flex; flex-direction: column; line-height: 1.15; }
  #brand b { font-size: 14px; font-weight: 600; color: var(--gw-blue-900); letter-spacing: .06em; }
  #brand span { font-size: 10px; color: var(--ink-300); letter-spacing: .08em; }
  .pill {
    display: flex; align-items: center; gap: 2px;
    border: 1px solid var(--line); background: var(--surface-2);
    border-radius: 999px; padding: 2px;
  }
  .pill button {
    border: 0; background: transparent; color: var(--ink-500);
    font-size: 11.5px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
  }
  .pill button.on { background: var(--gw-blue-700); color: #fff; }
  #topbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }

  /* 手机专用：右上角「语心」入口（桌面端对话面板常驻，不需要这个按钮） */
  #ai-open {
    display: none; align-items: center; gap: 5px; flex: 0 0 auto;
    height: 32px; padding: 0 9px 0 3px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--gw-blue-900); font-size: 11.5px; font-weight: 600;
    cursor: pointer; box-shadow: var(--sh-1);
  }
  #ai-open .ava {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--gw-blue-700); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
  }
  #ai-open.on { border-color: var(--gw-blue-500); background: var(--gw-blue-100); }

  /* ---------- 建筑标注 ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  #labels .lbl {
    position: absolute; transform: translate(-50%, -100%);
    font-size: 11px; line-height: 1.35; color: var(--ink-700);
    background: rgba(255, 255, 255, .88);
    border: 1px solid rgba(0, 70, 148, .18);
    border-radius: 5px; padding: 1px 5px; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(10, 40, 80, .10);
  }
  #labels .lbl.gate {
    color: #a30d1b; border-color: rgba(230, 0, 19, .35);
    background: rgba(255, 246, 246, .94);
  }

  /* ---------- 左侧控制面板 ---------- */
  /* 桌面端只是把面板与建筑卡包一层，display:contents 不产生任何盒子 */
  #dock { display: contents; }
  #panel {
    position: fixed; top: 74px; left: 16px; z-index: 10;
    background: var(--surface); color: var(--ink-900);
    border-radius: var(--r-l); width: 302px;
    border: 1px solid var(--line);
    box-shadow: var(--sh-2);
    max-height: calc(100vh - 96px);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #panel .panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 0;
  }
  #panel .panel-title { flex: 1 1 auto; min-width: 0; }
  /* 手机端收起后显示的一行摘要；桌面端始终隐藏 */
  #panel .mini-summary {
    display: none; margin-top: 2px;
    font-size: 11.5px; line-height: 1.4; color: var(--ink-500);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #panel .mini-summary.warn { color: var(--gw-red); }
  /* 标题固定、内容独立滚动：手机端把图例/说明收起来时不会把标题顶出屏幕 */
  #panel .panel-scroll {
    padding: 0 16px 15px; overflow-y: auto; min-height: 0;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  #panel h1 { margin: 0 0 3px; font-size: 16px; font-weight: 600; color: var(--gw-blue-900); flex: 1 1 auto; }
  #panelToggle { display: none; }
  #panelCollapse { display: none; }
  #panel .sub { margin: 0 0 12px; font-size: 11.5px; line-height: 1.6; color: var(--ink-500); }
  .row { margin: 8px 0; }
  .row label { display: block; font-size: 11.5px; color: var(--ink-500); margin-bottom: 3px; }
  select {
    width: 100%; padding: 7px 9px; border-radius: var(--r-s);
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--ink-900); font-size: 13px; font-family: inherit;
  }
  select:focus { outline: none; border-color: var(--gw-blue-500); background: #fff; }

  #status {
    margin-top: 11px; font-size: 12.5px; line-height: 1.7; color: var(--ink-700);
    min-height: 44px; border-top: 1px solid var(--line); padding-top: 10px;
  }
  #status b { color: var(--gw-blue-900); }
  #status .ok { color: var(--gw-blue-700); font-weight: 600; }
  #status .warn { color: var(--gw-red); }

  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .btns button, button.btn {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-700);
    padding: 6px 10px; border-radius: var(--r-s); font-size: 12px; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btns button:hover { border-color: var(--gw-blue-500); color: var(--gw-blue-700); }
  .btns button.on { background: var(--gw-blue-700); border-color: var(--gw-blue-700); color: #fff; }

  .legend {
    margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr;
    gap: 4px 8px; font-size: 11px; color: var(--ink-500);
  }
  .lg { display: flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 9px; border-radius: 2px; display: inline-block; border: 1px solid rgba(10,40,80,.10); }
  .hint {
    margin-top: 10px; font-size: 11px; line-height: 1.6; color: var(--ink-300);
    border-top: 1px solid var(--line); padding-top: 9px;
  }
  .hint b { color: var(--gw-blue-700); font-weight: 600; }

  /* ---------- 建筑信息卡 ---------- */
  #bcard {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(520px, calc(100vw - 420px)); z-index: 28;
    background: var(--surface); color: var(--ink-900);
    border: 1px solid var(--line); border-radius: var(--r-m);
    padding: 12px 14px 11px;
    box-shadow: var(--sh-2);
    font-size: 12.5px; line-height: 1.6;
  }
  #bcard.hidden { display: none; }
  #bcard h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; color: var(--gw-blue-900); }
  #bcard .meta { color: var(--ink-500); font-size: 11.5px; margin-bottom: 6px; }
  #bcard .meta b { color: var(--gw-blue-700); font-weight: 600; }
  #bcard .func { color: var(--ink-700); margin: 0 0 6px; }
  #bcard .foot { color: var(--ink-300); font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap; }
  #bcard .foot a { color: var(--gw-blue-500); text-decoration: none; }
  #bcard .x {
    position: absolute; right: 8px; top: 6px; background: none; border: 0;
    color: var(--ink-300); font-size: 18px; cursor: pointer; line-height: 1;
  }
  #bcard .x:hover { color: var(--ink-900); }

  /* ---------- 语心对话面板 ---------- */
  #ai {
    position: fixed; right: 20px; bottom: 92px; width: 360px; max-height: 66vh;
    display: flex; flex-direction: column; z-index: 30;
    background: var(--surface); color: var(--ink-900);
    border: 1px solid var(--line); border-radius: var(--r-l);
    box-shadow: var(--sh-2);
    font-size: 13px;
  }
  #ai.collapsed .ai-body, #ai.collapsed .ai-input, #ai.collapsed .chips { display: none; }
  #ai-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
  }
  #ai-head .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--gw-blue-700); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  #ai-head b { font-size: 13.5px; font-weight: 600; color: var(--gw-blue-900); }
  #ai-badge {
    font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
    background: #e8f5ec; color: #1c7d45; border: 1px solid #c6e6d3;
  }
  #ai-badge.off { background: var(--gw-red-soft); color: #a30d1b; border-color: #f4c7cc; }
  #ai-toggle { margin-left: auto; color: var(--ink-300); }
  #ai-close {
    display: none; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto;
    margin-left: auto; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--ink-500); font-size: 13px; line-height: 1; cursor: pointer;
  }
  #ai-body { padding: 10px 12px; overflow-y: auto; max-height: 44vh; display: flex; flex-direction: column; gap: 8px; }
  .msg { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user {
    align-self: flex-end; background: var(--gw-blue-700); color: #fff;
    border-radius: 10px 10px 2px 10px; padding: 6px 9px; max-width: 86%;
  }
  .msg.bot {
    align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px 10px 10px 2px; padding: 6px 9px; max-width: 92%;
  }
  .msg.bot a { color: var(--gw-blue-500); }
  .msg.sys { align-self: center; color: var(--ink-300); font-size: 11.5px; }
  .card {
    margin-top: 6px; border: 1px solid var(--line); border-radius: var(--r-s);
    padding: 7px 9px; background: #fff;
  }
  .card b { color: var(--gw-blue-900); font-weight: 600; }
  .card .meta { color: var(--ink-500); font-size: 11.5px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
  .chip {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface-2);
    color: var(--ink-700); cursor: pointer;
  }
  .chip:hover { border-color: var(--gw-blue-500); color: var(--gw-blue-700); background: var(--gw-blue-100); }
  .ai-input { display: flex; gap: 6px; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
  .ai-input input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-s);
    color: var(--ink-900); padding: 7px 9px; font-size: 13px; font-family: inherit;
  }
  .ai-input input:focus { outline: none; border-color: var(--gw-blue-500); background: #fff; }
  .ai-input button {
    border: 1px solid var(--gw-blue-700); background: var(--gw-blue-700); color: #fff;
    padding: 7px 13px; border-radius: var(--r-s); cursor: pointer; font-size: 13px;
  }
  .ai-input button:disabled { opacity: .45; cursor: default; }

  /* ---------- 指北针 ---------- */
  #compass {
    position: fixed; right: 22px; bottom: 22px; z-index: 10;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--sh-1); pointer-events: none;
  }
  #needle {
    position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start;
    padding-top: 5px; color: var(--gw-red); font-size: 13px; transform-origin: 50% 50%;
  }
  #compass .n {
    position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-end;
    padding-bottom: 6px; font-size: 10px; color: var(--ink-300);
  }

  /* ---------- 第一人称漫游控制条 ---------- */
  #walkbar {
    position: fixed; left: 50%; bottom: 26px;
    transform: translateX(-50%) translateY(18px);
    z-index: 40; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: var(--r-m);
    background: var(--surface); border: 1px solid var(--line); color: var(--ink-900);
    box-shadow: var(--sh-2);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    font-size: 12.5px; white-space: nowrap;
  }
  #walkbar.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #walkbar button {
    width: 30px; height: 30px; border-radius: var(--r-s); padding: 0;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-700);
    cursor: pointer; font-size: 13px; line-height: 1;
  }
  #walkbar button:hover { border-color: var(--gw-blue-500); color: var(--gw-blue-700); }
  #walkbar #walk-info { min-width: 210px; color: var(--ink-700); }
  #walkbar #walk-progress {
    width: 150px; height: 5px; border-radius: 3px;
    background: var(--line); overflow: hidden;
  }
  #walkbar #walk-progress i {
    display: block; height: 100%; width: 0;
    background: var(--gw-blue-700); transition: width .12s linear;
  }
  body.walking #panel, body.walking #ai, body.walking #topbar {
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  body.walking #bcard { opacity: 0; pointer-events: none; }
  body.walking #labels { opacity: .3; transition: opacity .2s; }

  /* ============================================================
     手机端（≤760px）：顶栏通栏 + 底部抽屉
     桌面布局原样保留，只在窄屏重排；安全区用 env() 让开刘海和底部小白条
     ============================================================ */
  @media (max-width: 760px) {
    /* ---------- 顶栏 ---------- */
    #topbar {
      top: 0; left: 0; right: 0;
      height: auto; min-height: calc(48px + var(--safe-t));
      padding: calc(6px + var(--safe-t)) 10px 6px;
      gap: 8px; box-sizing: border-box;
      border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
      background: rgba(255, 255, 255, .94);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: 0 2px 12px rgba(10, 40, 80, .06);
    }
    #logo { width: 26px; height: 26px; font-size: 13px; }
    #brand { min-width: 0; overflow: hidden; }
    #brand b {
      font-size: 13px; letter-spacing: .04em; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    #brand span {
      font-size: 8.5px; letter-spacing: .02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #topbar .sep { display: none; }
    #campusSwitch { margin-left: auto; }
    #campusSwitch, #langSwitch, #ai-open { flex: 0 0 auto; }
    .pill button { font-size: 11px; padding: 4px 8px; }
    #ai-open { display: flex; }

    /* ---------- 底部抽屉 ---------- */
    #dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; flex-direction: column; gap: 8px;
      padding: 0 8px calc(8px + var(--safe-b));
      max-height: calc(100vh - 56px);
      max-height: calc(100dvh - 56px - var(--safe-t));
      pointer-events: none;
    }
    #dock > * { pointer-events: auto; }

    #panel {
      position: relative; top: auto; left: auto; width: auto;
      max-height: 60vh; max-height: 60dvh;
      padding: 8px 14px 10px; border-radius: 16px;
      flex: 0 1 auto; min-height: 0;
    }
    #panel .panel-head { padding: 0 0 2px; gap: 8px; cursor: pointer; }
    #panel h1 { margin: 0; font-size: 15.5px; }
    #panel .panel-scroll { padding: 0; }
    #panel .sub { display: none; }

    /* 收起态：只留标题 + 一行摘要 + 展开箭头 */
    #panel.collapsed .panel-scroll { display: none; }
    #panel.collapsed #panelToggle { display: none; }
    #panel.collapsed .mini-summary { display: block; }
    #panelCollapse {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; flex: 0 0 auto; padding: 0;
      border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2);
      color: var(--gw-blue-700); font-size: 12px; line-height: 1; cursor: pointer;
    }
    #panelCollapse .chev { font-style: normal; transition: transform .18s; }
    #panel.collapsed #panelCollapse .chev { transform: rotate(180deg); }

    #panelToggle {
      display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto;
      min-height: 28px; padding: 5px 10px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface-2);
      color: var(--gw-blue-700); font-size: 11.5px; font-weight: 500;
      cursor: pointer;
    }
    #panel .panel-extra { display: none; }
    #panel.expanded .panel-extra { display: block; }
    #panel.expanded #panelToggle {
      background: var(--gw-blue-100); border-color: var(--gw-blue-500); color: var(--gw-blue-700);
    }

    #panel .row { margin: 6px 0; }
    #panel .row label { font-size: 11.5px; margin-bottom: 3px; }
    select { font-size: 16px; padding: 9px 10px; border-radius: 9px; }
    /* 去掉移动端 300ms 点击延迟；地图画布由 OrbitControls 自己设 touch-action:none */
    button, select, .chip { touch-action: manipulation; }
    #status {
      margin-top: 8px; padding-top: 8px; min-height: 0;
      font-size: 12px; line-height: 1.55;
    }

    /* 按钮两行：三个开关一行，两个主操作一行 */
    .btns { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 9px; }
    .btns button {
      min-height: 38px; padding: 6px 4px; border-radius: 9px;
      font-size: 12.5px; white-space: nowrap;
    }
    #btnLabels, #btnRoads, #btnReset { grid-column: span 2; }
    #btnWalk, #btnLocate { grid-column: span 3; }

    .legend { margin-top: 10px; font-size: 11.5px; gap: 5px 10px; }
    .hint { font-size: 10.5px; }

    /* 建筑信息卡：叠在抽屉上方，不遮挡操作区 */
    #bcard {
      position: relative; left: auto; bottom: auto; transform: none;
      width: auto; max-height: 30vh; max-height: 30dvh; overflow-y: auto;
      flex: 0 2 auto; min-height: 0;
    }

    /* 指北针挪到右上角（和地图类应用一致），底部整条留给抽屉 */
    #compass {
      top: calc(60px + var(--safe-t)); bottom: auto; right: 12px;
      width: 42px; height: 42px;
    }
    #needle { font-size: 11px; padding-top: 4px; }
    #compass .n { font-size: 9px; padding-bottom: 4px; }

    /* ---------- 语心对话：全屏浮层 ---------- */
    #ai {
      display: none;
      left: 8px; right: 8px; width: auto;
      top: calc(56px + var(--safe-t));
      bottom: calc(8px + var(--safe-b) + var(--kb));
      max-height: none; border-radius: 16px; z-index: 60;
    }
    body.ai-open #ai { display: flex; }
    #ai-body { max-height: none; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
    #ai-toggle { display: none; }
    #ai-close { display: flex; }
    .chips { max-height: none; overflow-y: visible; flex: 0 0 auto; }
    .ai-input { flex: 0 0 auto; }

    /* ---------- 第一人称漫游控制条 ---------- */
    #walkbar {
      left: 8px; right: 8px; bottom: calc(8px + var(--safe-b));
      transform: none; white-space: normal;
      display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px;
      gap: 6px 8px; padding: 8px 10px;
    }
    #walkbar.on { transform: none; }
    #walkbar button { width: 100%; height: 32px; }
    #walkbar #walk-info {
      grid-area: 1 / 2; min-width: 0; align-self: center;
      font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #walk-pause { grid-area: 1 / 1; }
    #walk-exit { grid-area: 1 / 3; }
    #walkbar #walk-progress { grid-area: 2 / 1 / 3 / 4; width: 100%; justify-self: stretch; }
  }

  /* 小屏：去掉装饰性英文副标题，保证顶栏一行放得下 */
  @media (max-width: 400px) {
    #brand span { display: none; }
    #topbar { gap: 6px; }
    .pill button { padding: 4px 7px; }
    #ai-open { padding-right: 8px; }
  }
  /* 320px 级小屏（英文标签更长）：语心按钮只留头像，避免顶栏挤爆 */
  @media (max-width: 340px) {
    #ai-open { padding: 0 4px; }
    #ai-open .txt { display: none; }
  }
  /* ---------- 办事卡片（C3） ---------- */
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-head b { font-size: 13px; }
  .badge {
    font-size: 10px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-500);
  }
  .badge.ok { background: #e8f5ec; color: #1c7d45; border-color: #c6e6d3; }
  .badge.warn { background: var(--gw-red-soft); color: #a30d1b; border-color: #f4c7cc; }
  .badge.online { background: var(--gw-blue-100); color: var(--gw-blue-700); border-color: #cfe0f5; }
  .badge.mute { background: var(--surface-2); color: var(--ink-300); }
  .card .hours { margin-top: 5px; font-size: 12px; font-weight: 600; }
  .card .hours.open { color: #1c7d45; }
  .card .hours.closed { color: #a30d1b; }
  .card .hours.unknown { color: var(--ink-300); font-weight: 400; }
  .card .meta.sub { font-size: 11px; color: var(--ink-300); }
  .card .mats { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 5px; }
  .mat-item { font-size: 11.5px; color: var(--ink-700); line-height: 1.55; }
  .card .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .card .act {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--gw-blue-700);
    font-size: 11.5px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
  }
  .card .act:hover { background: var(--gw-blue-100); border-color: var(--gw-blue-500); }
</style>
</head>

<script>
/* 校区 / 语言切换：都写进 URL，切换即重新加载（保留另一个维度） */
(function () {
  var cm = /[?&]campus=(north|south)/.exec(location.search);
  var lm = /[?&]lang=(en|zh)/.exec(location.search);
  var curCampus = cm ? cm[1] : "south";
  var curLang = lm ? lm[1] : (function () {
    try { return localStorage.getItem("gdufs_lang") || "zh"; } catch (e) { return "zh"; }
  })();

  function go(campus, lang) {
    lang = lang === "en" ? "en" : "zh";
    // 语言偏好同时写进 localStorage 和 URL：URL 优先，且中英文都要显式带上。
    // 只给 en 带 lang 参数时，切回中文会得到无参数 URL，i18n.js 又读回
    // localStorage 里的 "en"，于是界面永远停在英文。
    try { localStorage.setItem("gdufs_lang", lang); } catch (e) { /* 忽略 */ }
    var qs = [];
    if (campus === "north") qs.push("campus=north");
    qs.push("lang=" + lang);
    location.href = location.pathname + "?" + qs.join("&");
  }

  var cbs = document.querySelectorAll("#campusSwitch button");
  for (var i = 0; i < cbs.length; i++) {
    (function (b) {
      b.classList.toggle("on", b.dataset.campus === curCampus);
      b.addEventListener("click", function () {
        if (b.dataset.campus === curCampus) return;
        go(b.dataset.campus, curLang);
      });
    })(cbs[i]);
  }

  var lbs = document.querySelectorAll("#langSwitch button");
  for (var j = 0; j < lbs.length; j++) {
    (function (b) {
      b.classList.toggle("on", b.dataset.lang === curLang);
      b.addEventListener("click", function () {
        if (b.dataset.lang === curLang) return;
        go(curCampus, b.dataset.lang);
      });
    })(lbs[j]);
  }

  // 首次进入按当前语言铺一遍文案
  if (window.GDUFS_LANG) window.GDUFS_LANG.apply(curLang);
  var cn = document.getElementById("compassN");
  if (cn) cn.textContent = curLang === "en" ? "N" : "北";
})();
</script>
