          def _find(name):
              name = (name or "").strip()
              if name in G["p"]:
                  return G["p"][name]
              for k, v in G["p"].items():
                  if name and (name in k or k in name):
                      return v
              return None

          def _dij(s, t):
              n = len(G["n"])
              INF = 1e18
              dist = [INF] * n
              prev = [-1] * n
              dist[s] = 0.0
              pq = [(0.0, s)]
              adj = [[] for _ in range(n)]
              for a, b, L in G["e"]:
                  adj[a].append((b, L))
                  adj[b].append((a, L))
              while pq:
                  d, u = heapq.heappop(pq)
                  if d > dist[u]:
                      continue
                  if u == t:
                      break
                  for v, w in adj[u]:
                      nd = d + w
                      if nd < dist[v]:
                          dist[v] = nd
                          prev[v] = u
                          heapq.heappush(pq, (nd, v))
              if dist[t] >= INF:
                  return None, None
              path = []
              cur = t
              while cur != -1:
                  path.append(cur)
                  cur = prev[cur]
              path.reverse()
              return dist[t], path

          def main(from_name: str, to_name: str) -> str:
              s = _find(from_name)
              t = _find(to_name)
              if s is None or t is None:
                  return _out({"ok": False, "error": "地点未识别", "from": from_name, "to": to_name}, ensure_ascii=False)
              if s == t:
                  return _out({"ok": False, "error": "起终点相同"}, ensure_ascii=False)
              d, path = _dij(s, t)
              if d is None:
                  return _out({"ok": False, "error": "路网不连通"}, ensure_ascii=False)
              pts = [[G["n"][i][0], G["n"][i][1]] for i in path]
              return _out({
                  "ok": True,
                  "from": from_name,
                  "to": to_name,
                  "distance": round(d, 1),
                  "minutes": max(1, round(d / 70.0)),
                  "points": pts
              }, ensure_ascii=False)
