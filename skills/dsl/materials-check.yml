          def main(item_title: str, campus: str = "south") -> str:
              title = (item_title or "").strip()
              svc = None
              for s in SERVICES:
                  if s["title"] and (title in s["title"] or s["title"] in title):
                      svc = s
                      break
              if svc is None:
                  return _out({"ok": False, "error": "未找到该事项"}, ensure_ascii=False)
              here = svc.get(campus) or []
              other = svc.get("north" if campus == "south" else "south") or []
              return _out({
                  "ok": True,
                  "item": svc["title"],
                  "department": svc["dept"],
                  "materials": svc["materials"],
                  "count": len(svc["materials"] or []),
                  "phone": svc["phone"],
                  "online": svc["online"],
                  "places_here": here,
                  "places_other": other,
                  "url": svc["url"]
              }, ensure_ascii=False)
        outputs:
          result:
            type: string
            children: null
