          def _dij(s, t):
              n = len(G["n"])
              INF = 1e18
              dist = [INF] * n
              prev = [-1] * n
              dist[s] = 0.0
              pq = [(0.0, s)]
              adj = [[] for _ in range(n)]
              for a, b, L in G["e"]:
                  adj[a].append((b, L))
                  adj[b].append((a, L))
              while pq:
                  d, u = heapq.heappop(pq)
                  if d > dist[u]:
                      continue
                  if u == t:
                      break
                  for v, w in adj[u]:
                      nd = d + w
                      if nd < dist[v]:
                          dist[v] = nd
                          prev[v] = u
                          heapq.heappush(pq, (nd, v))
              if dist[t] >= INF:
                  return None, None
              path = []
              cur = t
              while cur != -1:
                  path.append(cur)
                  cur = prev[cur]
              path.reverse()
              return dist[t], path

          def _route(from_name: str, to_name: str) -> str:
              s = _find(from_name)
              t = _find(to_name)
              if s is None or t is None:
                  return _out({"ok": False, "error": "地点未识别", "from": from_name, "to": to_name}, ensure_ascii=False)
              if s == t:
                  return _out({"ok": False, "error": "起终点相同"}, ensure_ascii=False)
              d, path = _dij(s, t)
              if d is None:
                  return _out({"ok": False, "error": "路网不连通"}, ensure_ascii=False)
              pts = [[G["n"][i][0], G["n"][i][1]] for i in path]
              return _out({
                  "ok": True,
                  "from": from_name,
                  "to": to_name,
                  "distance": round(d, 1),
                  "minutes": max(1, round(d / 70.0)),
                  "points": pts
              }, ensure_ascii=False)

          def main(query: str) -> str:
              import re as _re
              ALIAS = {"一饭": "文采园", "二饭": "博雅园", "三饭": "风采园",
                       "校医院": "门诊部", "大门": "正门", "会堂": "大会堂"}
              q = query
              for a, b in ALIAS.items():
                  q = q.replace(a, b)
              # 英文提问：把英文地名对应的中文标准名补到句尾，再走中文匹配
              low = q.lower()
              for en, zh in sorted(G.get("en", {}).items(), key=lambda kv: -len(kv[0])):
                  if en and en in low and zh not in q:
                      q = q + " " + zh
              cands = []
              for label in G["p"]:
                  core = _re.sub(r"[（(].*?[）)]", "", label)
                  pos = -1
                  for form in (label, core):
                      if form and form in q:
                          pos = max(pos, q.find(form))
                  if pos >= 0:
                      cands.append((pos, label))
              cands.sort()
              names = []
              for _, lab in cands:
                  if lab not in names:
                      names.append(lab)
              if len(names) >= 2:
                  return _route(names[0], names[1])
              if len(names) == 1:
                  return _out({"ok": False, "error": "只识别到一个地点，请补充起点或终点", "place": names[0]}, ensure_ascii=False)
              return _out({"ok": False, "error": "未识别到校园地点"}, ensure_ascii=False)

