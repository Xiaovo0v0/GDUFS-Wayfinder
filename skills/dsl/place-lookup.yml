app:
  description: '把口语化地名解析成校园地点与坐标'
  icon: '📍'
  icon_background: '#FDECEE'
  icon_type: emoji
  mode: workflow
  name: 'place-lookup · 地名解析'
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {}
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: 1700000000003-source-1700000000004-target
      source: '1700000000003'
      sourceHandle: source
      target: '1700000000004'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: 1700000000004-source-1700000000005-target
      source: '1700000000004'
      sourceHandle: source
      target: '1700000000005'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 开始
        type: start
        variables:
        - default: ''
          hint: ''
          label: '地名文本'
          max_length: 256
          options: []
          placeholder: ''
          required: true
          type: text-input
          variable: query
      height: 120
      id: '1700000000003'
      position:
        x: 120
        y: 300
      positionAbsolute:
        x: 120
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        selected: false
        title: '别名匹配'
        type: code
        code_language: python3
        variables:
        - value_selector:
          - '1700000000003'
          - query
          variable: query
        code: |-
          import json

          def _out(obj, **kw):
              return {"result": json.dumps(obj, ensure_ascii=False)}

          import json, re

          PLACES = json.loads(r"""[{"label":"大会堂（教工活动中心）","x":97.7,"z":252.4,"kind":"building","node":134},{"label":"图书馆","x":83.1,"z":178.9,"kind":"building","node":136},{"label":"院系办公楼","x":-307.7,"z":-123.2,"kind":"building","node":138},{"label":"行政办公楼","x":-270.4,"z":-142.3,"kind":"building","node":140},{"label":"南苑9栋","x":103.6,"z":-639.1,"kind":"building","node":142},{"label":"南苑10栋","x":23.7,"z":-637.7,"kind":"building","node":144},{"label":"南苑11栋","x":152.7,"z":-705.6,"kind":"building","node":146},{"label":"南苑13栋","x":148,"z":-732.6,"kind":"building","node":148},{"label":"南苑12栋","x":68.3,"z":-704.3,"kind":"building","node":150},{"label":"南苑7栋","x":226.7,"z":-544.5,"kind":"building","node":152},{"label":"南苑8栋","x":257.8,"z":-628.6,"kind":"building","node":154},{"label":"学生活动中心","x":153.5,"z":-492.5,"kind":"building","node":156},{"label":"北苑1栋","x":209.2,"z":-228.8,"kind":"building","node":158},{"label":"北苑4栋","x":179.3,"z":-399.9,"kind":"building","node":160},{"label":"北苑5栋","x":34.6,"z":-491.3,"kind":"building","node":162},{"label":"北苑3栋","x":176.3,"z":-355.6,"kind":"building","node":164},{"label":"北苑6栋","x":58.3,"z":-557,"kind":"building","node":166},{"label":"北苑2栋","x":195.9,"z":-290.9,"kind":"building","node":168},{"label":"后勤楼","x":232,"z":-163,"kind":"building","node":169},{"label":"博雅园（第二饭堂）","x":-16.7,"z":-499.4,"kind":"building","node":171},{"label":"师苑2栋","x":-16.6,"z":-378.9,"kind":"building","node":173},{"label":"师苑1栋","x":35.5,"z":-382.9,"kind":"building","node":175},{"label":"门诊部（校医院）","x":225.2,"z":-97.3,"kind":"building","node":177},{"label":"文采园（第一饭堂）","x":103.1,"z":-248,"kind":"building","node":179},{"label":"师苑3栋","x":-21.6,"z":-415.5,"kind":"building","node":181},{"label":"风采园（第三饭堂）","x":279.4,"z":-687.3,"kind":"building","node":183},{"label":"师苑（C16/C18）","x":7.9,"z":-363.2,"kind":"building","node":185},{"label":"B8学术报告厅","x":-97.4,"z":238.6,"kind":"building","node":187},{"label":"体育场看台","x":37.9,"z":505.8,"kind":"building","node":189},{"label":"体育馆（羽毛球馆）","x":141.9,"z":588.2,"kind":"building","node":90},{"label":"艺术楼","x":-83.6,"z":295.4,"kind":"building","node":191},{"label":"教学楼C栋","x":14.7,"z":-4.1,"kind":"building","node":193},{"label":"教学楼A栋","x":-56.2,"z":-112.8,"kind":"building","node":194},{"label":"教学楼B栋","x":-12,"z":-40.3,"kind":"building","node":196},{"label":"教学楼D栋","x":104,"z":74.9,"kind":"building","node":198},{"label":"教学楼E栋","x":12.6,"z":108.2,"kind":"building","node":200},{"label":"教学楼F栋","x":-56.4,"z":-11.3,"kind":"building","node":202},{"label":"教学楼G栋","x":-91.1,"z":-49.9,"kind":"building","node":204},{"label":"学术交流中心","x":-252.4,"z":-336.6,"kind":"building","node":206},{"label":"实验楼E区","x":-106.8,"z":171.7,"kind":"building","node":208},{"label":"实验楼D区","x":-199.5,"z":189.1,"kind":"building","node":210},{"label":"实验楼C区","x":-175.6,"z":86.6,"kind":"building","node":212},{"label":"实验楼B区","x":-265.9,"z":104.9,"kind":"building","node":214},{"label":"实验楼A区","x":-289.2,"z":67.9,"kind":"building","node":216},{"label":"正门","x":-250.8,"z":192.1,"kind":"gate","node":218},{"label":"行政出入口","x":-375.4,"z":-219.9,"kind":"gate","node":3},{"label":"1号门（中环路·隧道旁）","x":-6.6,"z":-170.1,"kind":"gate","node":48},{"label":"3号门（外环西路·学生活动中心旁）","x":196.6,"z":-473.9,"kind":"gate","node":219},{"label":"2号门","x":-25,"z":-576,"kind":"gate","node":22},{"label":"4号门","x":223,"z":-746,"kind":"gate","node":114}]""")

          ALIAS = {"一饭": "文采园（第一饭堂）", "二饭": "博雅园（第二饭堂）",
                   "校医院": "门诊部（校医院）", "行政楼": "行政办公楼"}

          def main(query: str) -> str:
              q = re.sub(r"[\s·、,，。？?]", "", query or "")
              if not q:
                  return _out({"ok": False, "error": "空查询"}, ensure_ascii=False)
              for a, full in ALIAS.items():
                  if a in q:
                      q = q.replace(a, full)
              cands = []
              for p in PLACES:
                  label = p["label"]
                  score = 0
                  if label in q:
                      score = 100 + len(label)
                  else:
                      core = re.sub(r"[（(].*?[）)]", "", label)
                      if core and core in q:
                          score = 60 + len(core)
                      elif q in label:
                          score = 30 + len(q)
                  if score:
                      cands.append({"label": label, "x": p["x"], "z": p["z"],
                                    "kind": p["kind"], "node": p["node"], "score": score})
              cands.sort(key=lambda c: -c["score"])
              if not cands:
                  return _out({"ok": False, "error": "未匹配到地点", "query": query}, ensure_ascii=False)
              best = cands[0]
              return _out({"ok": True, "query": query, "label": best["label"],
                                 "x": best["x"], "z": best["z"], "kind": best["kind"],
                                 "node": best["node"],
                                 "alternatives": [c["label"] for c in cands[1:4]]},
                                ensure_ascii=False)
        outputs:
          result:
            type: string
            children: null
      height: 120
      id: '1700000000004'
      position:
        x: 460
        y: 300
      positionAbsolute:
        x: 460
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        selected: false
        title: 输出
        type: end
        outputs:
        - value_selector:
          - '1700000000004'
          - result
          value_type: string
          variable: result
      height: 108
      id: '1700000000005'
      position:
        x: 800
        y: 300
      positionAbsolute:
        x: 800
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.9
  rag_pipeline_variables: []
